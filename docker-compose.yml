services:
  postgres-servers:
    build: .
    container_name: servers_db
    environment:
      POSTGRES_DB: servers_database
      POSTGRES_USER: servers_user
      POSTGRES_PASSWORD: servers_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_servers_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U servers_user -d servers_database" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_servers_data:
